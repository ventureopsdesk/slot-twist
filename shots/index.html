<!doctype html>
<meta charset="utf-8">
<title>Slot Twist store assets</title>
<script>
// Hands the store screenshots to the App Store Connect page that embeds this one.
const target = 'https://appstoreconnect.apple.com';
(async () => {
  const names = await (await fetch('manifest.json', {cache: 'no-store'})).json();
  parent.postMessage({ready: names.length}, target);
  for (const name of names) {
    const data = await (await fetch(name, {cache: 'no-store'})).arrayBuffer();
    parent.postMessage({name, data}, target, [data]);
  }
  parent.postMessage({done: true}, target);
})();
</script>
